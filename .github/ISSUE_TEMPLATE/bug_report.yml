name: Bug report
description: Report something that isn't working correctly.
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Before filing a bug, please check the [README](https://github.com/janstol/ThingViewer#readme) and search [existing issues](https://github.com/janstol/ThingViewer/issues) in case it's already been reported.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reliably reproduce the bug.
      placeholder: |
        1. Open the app
        2. Navigate to ...
        3. Tap ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Found on the Settings screen (bottom of the page).
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "e.g. Android 15, iOS 18.3"

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. Pixel 9, iPhone 16"

  - type: input
    id: server
    attributes:
      label: ThingSpeak server
      description: "Leave blank if using the default thingspeak.com. For self-hosted instances, provide the base URL only — do NOT include API keys."
      placeholder: "e.g. https://thingspeak.example.com"

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant error output or attach screenshots.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been reported before.
          required: true
