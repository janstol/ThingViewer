name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and re-attach assets to (e.g. v0.11.0). Skips publishing to Play. Leave empty to build the current branch instead.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.pfx

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.pfx
          storeType=PKCS12
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Build APKs
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols \
            --split-per-abi --target-platform android-arm64,android-arm

      - name: Rename APKs for release
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk thingviewer-${RELEASE_TAG}-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk thingviewer-${RELEASE_TAG}-armeabi-v7a.apk

      - name: Extract changelog section
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[0-9]+\.[0-9]+\.[0-9]+\]: /{ next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            build/app/outputs/flutter-apk/thingviewer-${{ env.RELEASE_TAG }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/thingviewer-${{ env.RELEASE_TAG }}-armeabi-v7a.apk

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-symbols-${{ env.RELEASE_TAG }}
          path: build/symbols
          retention-days: 90

  publish-internal:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - name: Download App Bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: release-aab
          path: build

      - name: Upload to Play Store internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.stol.thingviewer
          releaseFiles: build/app-release.aab
          track: internal
