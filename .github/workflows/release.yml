name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.pfx

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.pfx
          storeType=PKCS12
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[0-9]+\.[0-9]+\.[0-9]+\]: /{ next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-symbols-${{ github.ref_name }}
          path: build/symbols
          retention-days: 90

  publish-internal:
    needs: build
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - name: Download App Bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: release-aab
          path: build

      - name: Upload to Play Store internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.stol.thingviewer
          releaseFiles: build/app-release.aab
          track: internal
