name: thingviewer
description: Mobile app for viewing and visualizing data from ThingSpeak.

version: 0.11.0+1100 # (major * 10000) + (minor * 100) + patch

publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # TODO(migration): remove hive, hive_flutter and path_provider in 1.2.0,
  # once the Hive → SharedPreferences migration has reached the installed
  # base. Only used by lib/migration/migration_service.dart.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6

  fl_chart: ^1.2.0
  file_picker: ^11.0.3
  intl: ^0.20.3
  http: ^1.2.2
  package_info_plus: ^9.0.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  mockito: ^5.7.0
  build_runner: ^2.4.13
  fake_async: ^1.3.3
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  image_path: 'res/images/thingviewer_icon.png'
  android: true
  adaptive_icon_background: '#FF067BC2'
  adaptive_icon_foreground: 'res/images/thingviewer_icon_foreground.png'
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: 'res/images/thingviewer_icon_macos.png'
  web:
    generate: true
    background_color: '#067BC2'
    theme_color: '#067BC2'

flutter:
  uses-material-design: true

  generate: true

  assets:
    - res/images/thingviewer_icon_150.png
